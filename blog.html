<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>blog — 生一鸣</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="terminal">
    <div class="terminal-header">
      <div class="win-buttons">
        <span class="win-btn close"></span>
        <span class="win-btn min"></span>
        <span class="win-btn max"></span>
      </div>
      <span class="terminal-title">yeeminshon@portal — ~/blog — ls -t posts/</span>
    </div>

    <div class="terminal-body">
      <a href="index.html" class="back-link">← cd ~/ 返回首页</a>

      <p><span class="prompt">❯</span> <span style="color:var(--orange);">ls</span> -t ~/blog/posts/</p>
      <p style="color:var(--text-dim); margin-bottom:1.2rem;">
        共 1 篇文章 · 标签: <span class="tag green">MyBatis</span> <span class="tag blue">Java</span> <span class="tag orange">开源</span>
      </p>

      <hr class="divider">

      <ul class="post-list">
        <li>
          <a href="blog/mybatis-batch.html" class="post-item">
            <span class="post-date">2022-04</span>
            <span class="post-title">mybatisBatch：简化 MyBatis 批量保存的插件实践</span>
            <span class="post-tag" style="border-color:var(--green);color:var(--green);">MyBatis</span>
          </a>
        </li>
      </ul>

      <hr class="divider">

      <div class="terminal-footer">
        <span class="prompt">❯</span> <span style="color:var(--text-muted);">1 post · 按 <a href="index.html">cd ~</a> 返回首页</span>
        <span class="cursor"></span>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
